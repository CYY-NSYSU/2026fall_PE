const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const LETTERS=["A","B","C","D"];
let quiz=[],answers=[],current=0,currentSession=null,submissionState="idle";
const el=id=>document.getElementById(id);
function setStatus(id,message,type=""){const node=el(id);node.textContent=message;node.className=`status ${type}`}
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function setScreen(id){["start","quiz","results"].forEach(x=>el(x).classList.toggle("hidden",x!==id))}
function showAuth(){el("auth").classList.remove("hidden");["start","quiz","results"].forEach(id=>el(id).classList.add("hidden"))}
function showStart(session){currentSession=session;el("auth").classList.add("hidden");el("start").classList.remove("hidden");el("quiz").classList.add("hidden");el("results").classList.add("hidden");el("signedInAs").textContent=`已登入：${session.user.email}`;setStatus("startStatus","")}
async function initializeAuth(){const {data:{session}}=await supabaseClient.auth.getSession();if(session)showStart(session);else showAuth();supabaseClient.auth.onAuthStateChange((_event,session)=>{if(session)showStart(session);else showAuth()})}
async function signIn(){const email=el("authEmail").value.trim();const password=el("authPassword").value;if(!email||!password){setStatus("authStatus","請輸入 Email 與密碼。","error");return}setStatus("authStatus","正在登入…");const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){setStatus("authStatus",`登入失敗：${error.message}`,"error");return}showStart(data.session)}
async function signUp(){const email=el("authEmail").value.trim();const password=el("authPassword").value;if(!email||password.length<12){setStatus("authStatus","請輸入有效 Email，密碼至少 12 個字元。","error");return}setStatus("authStatus","正在建立帳號…");const {data,error}=await supabaseClient.auth.signUp({email,password,options:{emailRedirectTo:window.location.href}});if(error){setStatus("authStatus",`註冊失敗：${error.message}`,"error");return}if(data.session)showStart(data.session);else setStatus("authStatus","驗證信已寄出；請完成 Email 驗證後回到本頁登入。","success")}
async function signOut(){await supabaseClient.auth.signOut();currentSession=null;el("authPassword").value="";showAuth()}
function startQuiz(){const name=el("student").value.trim(),studentId=el("studentId").value.trim();if(!currentSession){showAuth();return}if(!name||!studentId||!el("consent").checked){setStatus("startStatus","請填寫姓名、學號並勾選資料使用告知後再開始。","error");return}const count=Number(el("count").value);quiz=shuffle(BANK.questions).slice(0,count);answers=Array(quiz.length).fill(null);current=0;submissionState="idle";el("retrySubmit").classList.add("hidden");setScreen("quiz");renderQuestion()}
function renderQuestion(){const q=quiz[current];el("position").textContent=`第 ${current+1} 題／共 ${quiz.length} 題`;el("category").textContent=q.health_assessment_categories.join("、");el("progress").value=current;el("progress").max=quiz.length;el("stem").textContent=q.stem;const holder=el("choices");holder.replaceChildren();LETTERS.forEach(letter=>{const label=document.createElement("label");label.className="choice";const radio=document.createElement("input");radio.type="radio";radio.name="answer";radio.value=letter;radio.checked=answers[current]===letter;const text=document.createElement("span");text.textContent=`${letter}. ${q.options[letter]}`;label.append(radio,text);label.addEventListener("click",()=>{answers[current]=letter;[...holder.children].forEach(x=>x.classList.remove("selected"));label.classList.add("selected");el("nextButton").disabled=false});if(radio.checked)label.classList.add("selected");holder.append(label)});el("nextButton").disabled=answers[current]===null;el("nextButton").textContent=current===quiz.length-1?"完成並查看批改結果":"確認並下一題"}
function nextQuestion(){if(!answers[current])return;if(current<quiz.length-1){current+=1;renderQuestion()}else showResults()}
async function submitAttempt(){if(submissionState==="submitting"||submissionState==="success")return;if(!currentSession){setStatus("recordStatus","登入狀態已失效，請重新登入後再提交。","error");el("retrySubmit").classList.remove("hidden");return}submissionState="submitting";el("retrySubmit").classList.add("hidden");setStatus("recordStatus","正在以伺服器端計分方式保存練習紀錄…");const payload=quiz.map((q,i)=>({question_id:q.id,selected_answer:answers[i]}));const {data,error}=await supabaseClient.rpc("submit_health_assessment_attempt",{p_student_name:el("student").value.trim(),p_student_id:el("studentId").value.trim(),p_answers:payload});if(error){submissionState="error";setStatus("recordStatus",`提交失敗：${error.message}`,"error");el("retrySubmit").classList.remove("hidden");return}submissionState="success";const saved=Array.isArray(data)?data[0]:data;setStatus("recordStatus",`紀錄已保存（${saved.correct_count}／${saved.question_count} 題答對）。`,"success")}
function showResults(){const correct=quiz.reduce((total,q,i)=>total+Number(q.accepted_answers.includes(answers[i])),0);const percentage=Math.round(correct/quiz.length*100);const name=el("student").value.trim();el("resultName").textContent=`${name}，以下是你的逐題批改與正確答案說明。`;el("score").textContent=`${correct} / ${quiz.length}`;el("scoreDetail").textContent=`答對率 ${percentage}%`;el("recordSummary").textContent=`姓名：${name}｜學號：${el("studentId").value.trim()}｜本次題數：${quiz.length}｜答對題數：${correct}｜答對率：${percentage}%`;setStatus("recordStatus","");const reviews=el("reviews");reviews.replaceChildren();quiz.forEach((q,i)=>{const isCorrect=q.accepted_answers.includes(answers[i]);const card=document.createElement("article");card.className=`review ${isCorrect?"correct":"incorrect"}`;const meta=document.createElement("p");meta.className="meta";meta.textContent=`第 ${i+1} 題｜${q.year} 年 ${q.exam_code}｜原題第 ${q.question_number} 題｜${q.health_assessment_categories.join("、")}`;const stem=document.createElement("p");stem.className="stem";stem.textContent=q.stem;const mine=document.createElement("p");mine.className=isCorrect?"answer-ok":"answer-bad";mine.textContent=`${isCorrect?"✓ 答對":"✗ 答錯"}：你的答案 ${answers[i]}`;const answer=document.createElement("p");answer.textContent=`官方正解：${q.answer_display}`;const explanation=document.createElement("p");explanation.className="explanation";explanation.textContent=`正確答案說明：${q.correct_answer_explanation}`;card.append(meta,stem,mine,answer,explanation);if(q.correction_note){const note=document.createElement("p");note.className="meta";note.textContent=`勘誤／計分說明：${q.correction_note}`;card.append(note)}reviews.append(card)});setScreen("results");window.scrollTo({top:0,behavior:"smooth"});void submitAttempt()}
el("signInButton").addEventListener("click",signIn);el("signUpButton").addEventListener("click",signUp);el("signOutButton").addEventListener("click",signOut);el("startButton").addEventListener("click",startQuiz);el("nextButton").addEventListener("click",nextQuestion);el("retrySubmit").addEventListener("click",submitAttempt);el("restart").addEventListener("click",()=>{showStart(currentSession);window.scrollTo({top:0,behavior:"smooth"})});
